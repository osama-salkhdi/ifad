:root{--side:#123f3e;--acc:#1b6b67;--gold:#b98a3e;--gold2:#f3e7cf;--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2d2c;--mut:#6b7774;--line:#e7dfcf;--ok:#2f855a;--okb:#e3f3ea;--warn:#b7791f;--warnb:#fbf0d9;--bad:#c0392b;--badb:#fbe5e2;--info:#2b6cb0;--infob:#e3eefa;--sh:0 2px 10px rgba(60,45,20,.06)}
body.dark{--bg:#0f1716;--card:#16211f;--ink:#e6eeea;--mut:#93a39e;--line:#26332f;--gold2:#3a3020;--okb:#163126;--warnb:#3a2e14;--badb:#3d1c18;--infob:#152a40;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.app{display:flex;min-height:100vh;gap:16px;padding:14px}
/* sidebar */
.side{width:250px;flex-shrink:0;background:var(--side);color:#f3ede0;border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
.brand .lg{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.brand .lg img,.brand .lg svg{width:100%;height:100%;object-fit:contain}
.brand b{font-size:16px;font-weight:800;line-height:1.3;color:#f4e3bf}
.side .cap{font-size:11.5px;opacity:.55;padding:6px 10px 2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;color:#e9e2d2;text-decoration:none;font-weight:500;font-size:14.5px;margin:1px 0}
.nav a svg{width:18px;height:18px;opacity:.85;flex-shrink:0}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--gold2);color:var(--side);font-weight:800}
body.dark .nav a.on{background:#f3e7cf}
.nav a .cnt{margin-inline-start:auto;background:var(--gold);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;font-weight:700}
.side .bottom{margin-top:auto;padding-top:12px}
.sbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13px}
.sbox .t{font-size:12px;opacity:.7;margin-bottom:6px}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.dots button.on{border-color:#f4e3bf;box-shadow:0 0 0 2px var(--side),0 0 0 4px #f4e3bf}

.me{display:flex;align-items:center;gap:8px}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0}

.me small{opacity:.65;display:block;line-height:1.2}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;margin-top:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:#48bb78;display:inline-block}
.sync.saving i{background:#f6ad55}.sync.err i{background:#fc8181}
/* main */
main{flex:1;min-width:0}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;margin-bottom:16px;background:linear-gradient(135deg,var(--side),var(--acc));}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.9)}
.hero .pat{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:44px 44px}
.hero .veil{position:absolute;inset:0;background:radial-gradient(ellipse 60% 75% at center,rgba(250,246,238,.96) 0%,rgba(250,246,238,.85) 40%,rgba(250,246,238,.35) 78%,rgba(250,246,238,.15) 100%)}
body.dark .hero .veil{background:radial-gradient(ellipse 60% 75% at center,rgba(15,23,22,.95) 0%,rgba(15,23,22,.82) 40%,rgba(15,23,22,.35) 78%,rgba(15,23,22,.15) 100%)}
.hero>*:not(.bgimg):not(.pat):not(.veil){position:relative}
.hero .hlogo{width:96px;height:96px;margin-bottom:6px;display:grid;place-items:center}
.hero .hlogo img,.hero .hlogo svg{max-width:100%;max-height:100%;object-fit:contain}
.hero h1{margin:0;font-size:34px;font-weight:800;color:var(--side);line-height:1.25}
body.dark .hero h1{color:#f4e3bf}
.hero .sub{color:var(--mut);font-size:15px;margin-top:2px}
.hsearch{margin-top:16px;width:min(520px,100%);position:relative}
.hsearch input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:12px 20px 12px 56px;box-shadow:var(--sh);outline:none}
.hsearch input:focus{border-color:var(--gold)}
.hsearch .sbtn{position:absolute;left:5px;top:5px;width:40px;height:40px;border-radius:50%;background:var(--side);color:#fff;display:grid;place-items:center}
.hsearch .sbtn svg{width:18px}
.sres{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:right;max-height:340px;overflow:auto;z-index:20;display:none}
.sres.open{display:block}
.sres a{display:flex;gap:10px;align-items:center;padding:9px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:hover{background:var(--gold2)}
.sres small{color:var(--mut);margin-inline-start:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 14px;font-size:13px;color:var(--mut)}

.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 4px 14px}
.pagehead h2{margin:0;font-size:22px;font-weight:800}
.pagehead .sub{color:var(--mut);font-size:13.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--sh);margin-bottom:16px}
.panel>h3,.panel .ph h3{margin:0 0 12px;font-size:16px;font-weight:800}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h3{margin:0!important}
.home-grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;text-decoration:none;color:var(--ink);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.scard:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,45,20,.08)}
.scard svg{width:30px;height:30px;color:var(--side);stroke-width:1.6}
body.dark .scard svg{color:#e7cf9f}
.scard b{font-size:15px}
.scard small{color:var(--mut);font-size:12px;line-height:1.4}
.gtitle{font-size:12.5px;color:var(--mut);margin:12px 2px 8px;font-weight:700}
.gtitle:first-of-type{margin-top:0}
.act{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}
.act .it{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px}
.act .it small{color:var(--mut);display:block;font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}
.kpi .l{font-size:13px;color:var(--mut);line-height:1.3}
.kpi .v{font-size:12px;color:var(--mut)}
.ring{--p:0;--c:var(--acc);width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex-shrink:0}
.ring::before{direction:ltr;content:attr(data-v);width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:17px}
.ring.lg{width:110px;height:110px}.ring.lg::before{width:88px;height:88px;font-size:24px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
canvas{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.cwrap{position:relative}
.ctip{position:absolute;pointer-events:none;background:var(--side);color:#fff;font-size:12.5px;padding:4px 10px;border-radius:8px;white-space:nowrap;display:none;z-index:5}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:12.5px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--gold2)}
.pbar{display:inline-flex;align-items:center;gap:8px;min-width:140px}
.pbar span{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.pbar span i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pbar b{font-size:13px;min-width:38px}
.badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--infob);color:var(--info)}.b-mut{background:var(--line);color:var(--mut)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:inline-grid;place-items:center;font-weight:800;overflow:hidden;vertical-align:middle;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:30px}
.who{display:flex;align-items:center;gap:10px}
.muted{color:var(--mut);font-size:13.5px}
.empty{text-align:center;color:var(--mut);padding:26px;border:2px dashed var(--line);border-radius:14px}
/* buttons/forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--side);border-color:var(--side);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--badb)}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:9px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--mut);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],select,textarea,input:not([type]){border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mut)}
.fgrid label.full{grid-column:1/-1}
.fgrid label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.fgrid .hint{font-weight:400;font-size:12px}
.factions{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
input[type=range]{accent-color:var(--acc);width:100%}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,25,24,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:50}
.modal.open{display:flex}
.mbox{background:var(--card);border-radius:20px;width:min(620px,100%);padding:18px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox.wide{width:min(980px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead h2{margin:0;font-size:19px}
.toast{position:fixed;bottom:20px;left:20px;background:var(--side);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.2);transition:.3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--bad)}
/* misc */
.axis{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.axis .ah{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gold2);font-weight:800;flex-wrap:wrap}
body.dark .axis .ah{background:#1d2a27}
.axis .ah .pbar{margin-inline-start:auto}
.goal{display:grid;grid-template-columns:1fr 64px 220px auto;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.goal .yr{font-size:12px}
.slider{display:flex;align-items:center;gap:8px}
.slider b{min-width:42px;text-align:left}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof h2{margin:0;font-size:22px}
.tl{position:relative;height:14px;background:var(--line);border-radius:99px;margin:28px 0 30px}
.tl .el{position:absolute;inset-inline-start:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 6px,#d5ab62 6px,#d5ab62 12px);border-radius:99px;opacity:.55}
.tl .ach{position:absolute;inset-inline-start:0;top:3px;bottom:3px;background:var(--acc);border-radius:99px}
.tl .yr{position:absolute;top:-22px;font-size:11.5px;color:var(--mut);transform:translateX(50%)}
.tl .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--card)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px}
.file svg{width:16px;color:var(--mut)}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--gold2);border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-wrap}
.banner{background:var(--warnb);color:var(--warn);border-radius:14px;padding:10px 16px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .btn{margin-inline-start:auto}
.rhead{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold);padding-bottom:12px;margin-bottom:14px}
.rhead .lg{width:64px;height:64px}
.rhead .lg img,.rhead .lg svg{width:100%;height:100%;object-fit:contain}
.rhead h2{margin:0;font-size:20px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(60,45,20,.12);text-align:center}
.login .lg{width:90px;height:90px;margin:0 auto 6px}
.login .lg img,.login .lg svg{width:100%;height:100%;object-fit:contain}
.login h1{margin:0;color:var(--side);font-size:26px}
body.dark .login h1{color:#f4e3bf}
.login form{display:flex;flex-direction:column;gap:10px;margin-top:18px;text-align:right}
.login .err{color:var(--bad);font-size:13.5px;min-height:20px}
.mtoggle{display:none}
@media (max-width:1100px){.home-grid,.grid2,.grid2e{grid-template-columns:1fr}}
@media (max-width:820px){.app{padding:8px;gap:8px}.side{position:fixed;inset:8px auto 8px 8px;right:8px;z-index:40;transform:translateX(120%);transition:.25s;height:auto}.side.open{transform:none}.mtoggle{display:inline-flex;position:fixed;top:12px;right:12px;z-index:41}.hero h1{font-size:26px}.goal{grid-template-columns:1fr;gap:4px}.fgrid{grid-template-columns:1fr}main{padding-top:44px}}
@media print{.side,.noprint,.mtoggle,.toast{display:none!important}.app{padding:0}body{background:#fff}.panel{box-shadow:none;break-inside:avoid}main{padding:0}}

/* ================= storage (IndexedDB or Raspberry Pi server) ================= */
const Store={mode:'local',db:null,ver:0,
  idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ifad-platform',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),o=t.objectStore(store),q=fn(o);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  async init(){
    if(location.protocol.startsWith('http')){try{const r=await fetch('api/state',{cache:'no-store'});if(r.ok){const j=await r.json();this.mode='server';this.ver=j.version||0;return j.state||null}}catch(e){}}
    this.db=await this.idb();return await this.tx('kv','readonly',o=>o.get('state'));
  },
  async save(state){
    if(this.mode==='server'){
      try{const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:this.ver,state})});
        const j=await r.json();if(r.status===409){this.ver=j.version;return{conflict:true,state:j.state}}if(!r.ok)return{error:true};this.ver=j.version;return{ok:true}}catch(e){return{error:true}}
    }
    try{await this.tx('kv','readwrite',o=>o.put(JSON.parse(JSON.stringify(state)),'state'));return{ok:true}}catch(e){return{error:true}}
  },
  async poll(){if(this.mode!=='server')return null;try{const r=await fetch('api/state?v='+this.ver,{cache:'no-store'});const j=await r.json();if(j.version!==this.ver){this.ver=j.version;return j.state}}catch(e){}return null},
  async putFile(id,blob){if(this.mode==='server'){const r=await fetch('api/files/'+id,{method:'PUT',body:blob});if(!r.ok)throw new Error('upload');return}await this.tx('files','readwrite',o=>o.put(blob,id))},
  async getFile(id){if(this.mode==='server'){const r=await fetch('api/files/'+id);return r.ok?await r.blob():null}return await this.tx('files','readonly',o=>o.get(id))},
  async delFile(id){if(this.mode==='server'){try{await fetch('api/files/'+id,{method:'DELETE'})}catch(e){}return}await this.tx('files','readwrite',o=>o.delete(id))},
  async allFiles(){if(this.mode==='server')return null;const keys=await this.tx('files','readonly',o=>o.getAllKeys());const out={};for(const k of keys)out[k]=await this.getFile(k);return out}
};

/* ================= model helpers ================= */
const trackOf=s=>S.tracks.find(t=>t.id===(s&&s.trackId));
const goalsOf=t=>t?t.axes.flatMap(a=>a.goals):[];
const stuById=id=>S.students.find(s=>s.id===id);
const taskById=id=>S.tasks.find(t=>t.id===id);
function goalById(gid){for(const t of S.tracks)for(const a of t.axes)for(const g of a.goals)if(g.id===gid)return{t,a,g};return null}
function goalVal(s,gid,date){if(!date)return +(s.progress[gid]||0);let v=0,best='';for(const h of S.history)if(h.sid===s.id&&h.gid===gid&&h.date<=date&&h.date>=best){best=h.date;v=h.value}return v}
function wavg(goals,s,date){let W=0,V=0;for(const g of goals){const w=+g.weight||1;W+=w;V+=w*goalVal(s,g.id,date)}return W?Math.round(V/W):0}
const studentPct=(s,date)=>wavg(goalsOf(trackOf(s)),s,date);
const axisPct=(s,a,date)=>wavg(a.goals,s,date);
const progYears=d=>Math.max(0,(parseD(d||today())-parseD(S.settings.startDate))/(365.25*864e5));
const elapsedPct=()=>Math.round(clamp(progYears()/(+S.settings.years||5)*100));
const curYear=()=>Math.min(+S.settings.years||5,Math.floor(progYears())+1);
function expectedPct(s){const gs=goalsOf(trackOf(s)),y=progYears();let W=0,E=0;for(const g of gs){const w=+g.weight||1;W+=w;E+=w*clamp(y-(g.year-1),0,1)*100}return W?Math.round(E/W):0}
function status(s){const d=studentPct(s)-expectedPct(s);return d>=5?['متقدم','b-ok']:d>=-10?['ضمن الخطة','b-info']:['متأخر','b-bad']}
const tasksFor=s=>S.tasks.filter(t=>!t.trackId||t.trackId===s.trackId);
const subOf=(tid,sid)=>S.subs.find(x=>x.taskId===tid&&x.sid===sid);
function attendance(s,from,to){const ss=S.sessions.filter(x=>(!x.trackId||x.trackId===s.trackId)&&x.date>=(s.joined||'')&&(!from||x.date>=from)&&(!to||x.date<=to));return ss.length?Math.round(ss.filter(x=>x.present.includes(s.id)).length*100/ss.length):null}
function avgScore(subs){const g=subs.filter(x=>x.status==='graded'&&x.score!=null);return g.length?Math.round(g.reduce((a,x)=>a+ +x.score,0)/g.length):null}
function submitRate(s){const due=tasksFor(s).filter(t=>t.due<=today());return due.length?Math.round(due.filter(t=>subOf(t.id,s.id)).length*100/due.length):null}

const isAdmin=()=>ME&&ME.role==='admin';
const myStudent=()=>ME&&ME.studentId?stuById(ME.studentId):null;

/* ================= persistence ================= */
let syncState='ok';
function setSync(s){syncState=s;const el=$('#sync');if(el){el.className='sync '+s;el.lastElementChild.textContent=s==='ok'?(Store.mode==='server'?'متصل بالخادم: محفوظ':'محفوظ على هذا الجهاز'):s==='saving'?'جارٍ الحفظ…':'تعذّر الحفظ'}}
async function mutate(fn){fn(S);render();setSync('saving');
  for(let i=0;i<4;i++){const r=await Store.save(S);if(r.ok){setSync('ok');return true}
    if(r.conflict){S=r.state;fn(S);continue}break}
  setSync('err');toast('تعذّر الحفظ، تحقق من الاتصال بالخادم','err');render();return false}

/* ================= UI helpers ================= */
function toast(t,cls=''){const el=$('#toast');el.textContent=t;el.className='toast show '+cls;clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',2600)}
function modal(html,wide){const m=$('#modal');m.innerHTML=`<div class="mbox ${wide?'wide':''}">${html}</div>`;m.classList.add('open');return m.firstElementChild}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML=''}
const mhead=t=>`<div class="mhead"><h2>${t}</h2><button class="icon-btn" data-close>×</button></div>`;
function field(f){const v=esc(f.value??''),req=f.required?'required':'',full=f.full?'full':'';
  if(f.type==='select')return `<label class="${full}">${f.label}<select name="${f.name}" ${req}>${f.options.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(f.value??'')?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`;
  if(f.type==='textarea')return `<label class="${full||'full'}">${f.label}<textarea name="${f.name}" rows="${f.rows||3}" ${req}>${v}</textarea></label>`;
  if(f.type==='file')return `<label class="${full||'full'}">${f.label}<input type="file" name="${f.name}" ${f.multiple?'multiple':''} ${f.accept?`accept="${f.accept}"`:''} ${req}>${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>`;
  if(f.type==='checkbox')return `<label class="ck ${full}"><input type="checkbox" name="${f.name}" ${f.value?'checked':''}> ${f.label}</label>`;
  if(f.type==='html')return f.html;
  return `<label class="${full}">${f.label}<input type="${f.type||'text'}" name="${f.name}" value="${v}" ${req} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.step?`step="${f.step}"`:''} ${f.ltr?'dir="ltr"':''} placeholder="${esc(f.ph||'')}">${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>`}
function formModal({title,fields,submit='حفظ',onSubmit,wide}){
  const box=modal(mhead(title)+`<form class="fgrid">${fields.map(field).join('')}<div class="factions"><button class="btn pri">${submit}</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`,wide);
  const form=$('form',box);form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),d={};
    fields.forEach(f=>{if(!f.name)return;if(f.type==='file')d[f.name]=fd.getAll(f.name).filter(x=>x&&x.size);else if(f.type==='checkbox')d[f.name]=fd.get(f.name)==='on';else d[f.name]=String(fd.get(f.name)??'').trim()});
    const btn=$('button.pri',form);btn.disabled=true;try{const r=await onSubmit(d,form);if(r!==false)closeModal()}finally{btn.disabled=false}};
  return box}

function shade(hex,f){let c=String(hex).replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const m=v=>clamp(Math.round(f>1?v+(255-v)*(f-1):v*f),0,255);return `rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`}

function prep(cv,h){const w=cv.parentElement.clientWidth||600,dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return{c,w,h}}
function anim(draw){const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/800);draw(1-Math.pow(1-k,3));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,h=hit(x,y);if(h){tip.textContent=h;tip.style.display='block';tip.style.left=Math.min(x+12,r.width-tip.offsetWidth-4)+'px';tip.style.top=(y-34)+'px'}else tip.style.display='none'};cv.onmouseleave=()=>tip.style.display='none'}
function bars3D(cv,items,o={}){
  if(!cv)return;const H=o.height||300,max=o.max||100,unit=o.unit??'%';
  const {c,w,h}=prep(cv,H);const ink=cssv('--ink'),mut=cssv('--mut'),line=cssv('--line');
  const dx=14,dy=-10,top=26,bot=o.rot?70:46,left=36,right=18,ph=h-top-bot,pw=w-left-right-dx,n=Math.max(items.length,1),slot=pw/n,bw=Math.min(54,slot*.62);
  const y0=top+ph,Y=v=>y0-ph*clamp(v,0,max)/max;const rects=[];
  const draw=k=>{c.clearRect(0,0,w,h);c.font='12px Tajawal, sans-serif';
    c.fillStyle=shade(line.startsWith('#')?line:'#e7dfcf',1);
    c.beginPath();c.moveTo(left,y0);c.lineTo(left+dx,y0+dy);c.lineTo(left+dx+pw,y0+dy);c.lineTo(left+pw,y0);c.closePath();c.globalAlpha=.6;c.fill();c.globalAlpha=1;
    for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(left,y);c.lineTo(left+dx,y+dy);c.lineTo(left+dx+pw,y+dy);c.stroke();c.fillStyle=mut;c.textAlign='right';c.fillText(Math.round(v)+(unit==='%'?'%':''),left-6,y+4)}
    c.beginPath();c.moveTo(left+dx,y0+dy);c.lineTo(left+dx,top+dy);c.stroke();
    rects.length=0;
    items.forEach((it,i)=>{const x=left+pw-(i+1)*slot+(slot-bw)/2,v=(it.value||0)*k,yv=Y(v),col=it.color||cssv('--acc')||'#1b6b67';
      c.fillStyle=shade(col,.72);c.beginPath();c.moveTo(x+bw,yv);c.lineTo(x+bw+dx,yv+dy);c.lineTo(x+bw+dx,y0+dy);c.lineTo(x+bw,y0);c.closePath();c.fill();
      const g=c.createLinearGradient(x,0,x+bw,0);g.addColorStop(0,shade(col,1.12));g.addColorStop(1,shade(col,.95));c.fillStyle=g;c.fillRect(x,yv,bw,y0-yv);
      c.fillStyle=shade(col,1.35);c.beginPath();c.moveTo(x,yv);c.lineTo(x+dx,yv+dy);c.lineTo(x+bw+dx,yv+dy);c.lineTo(x+bw,yv);c.closePath();c.fill();
      c.fillStyle=ink;c.textAlign='center';c.font='bold 12px Tajawal, sans-serif';c.fillText(Math.round(v)+unit,x+bw/2+dx/2,yv+dy-5);
      c.font='12px Tajawal, sans-serif';c.fillStyle=mut;let lab=String(it.label||'');const mw=o.rot?bot*1.3:slot-4;while(lab.length>2&&c.measureText(lab).width>mw)lab=lab.slice(0,-2)+'…';
      if(o.rot){c.save();c.translate(x+bw/2,y0+12);c.rotate(-Math.PI/5);c.textAlign='right';c.fillText(lab,0,4);c.restore()}else c.fillText(lab,x+bw/2,y0+18);
      rects.push([x,Math.min(yv+dy,y0-4),x+bw+dx,y0,`${it.label}: ${Math.round(it.value)}${unit}`])});
  };anim(draw);tipFor(cv,(x,y)=>{const r=rects.find(r=>x>=r[0]&&x<=r[2]&&y>=r[1]-14&&y<=r[3]);return r&&r[4]});
  if(o.onClick)cv.onclick=e=>{const b=cv.getBoundingClientRect(),x=e.clientX-b.left;const i=rects.findIndex(r=>x>=r[0]&&x<=r[2]);if(i>=0)o.onClick(items[i])},cv.style.cursor='pointer';
}
function pie3D(cv,items,o={}){
  if(!cv)return;const H=o.height||250;const {c,w,h}=prep(cv,H);const tot=items.reduce((a,x)=>a+x.value,0)||1;
  const rx=Math.min(w*.42,150),ry=rx*.5,depth=24,cx=w/2,cy=h/2-depth/2+4;const card=cssv('--card');
  const draw=k=>{c.clearRect(0,0,w,h);const span=Math.PI*2*k;let segs=[],a=-Math.PI/2;items.forEach(it=>{const s=a,e=a+span*it.value/tot;segs.push([s,e,it]);a=e});
    for(let d=depth;d>0;d--)segs.forEach(([s,e,it])=>{if(e-s<=0)return;c.fillStyle=shade(it.color,.62+.1*(1-d/depth));c.beginPath();c.moveTo(cx,cy+d);c.ellipse(cx,cy+d,rx,ry,0,s,e);c.closePath();c.fill()});
    segs.forEach(([s,e,it])=>{if(e-s<=0)return;const g=c.createRadialGradient(cx-rx*.3,cy-ry*.5,10,cx,cy,rx);g.addColorStop(0,shade(it.color,1.3));g.addColorStop(1,it.color);c.fillStyle=g;c.beginPath();c.moveTo(cx,cy);c.ellipse(cx,cy,rx,ry,0,s,e);c.closePath();c.fill();c.strokeStyle=card;c.lineWidth=1.5;c.stroke();
      const m=(s+e)/2,pct=Math.round(it.value/tot*100);if(pct>=6&&k>.9){c.fillStyle='#fff';c.font='bold 13px Tajawal, sans-serif';c.textAlign='center';c.fillText(pct+'%',cx+Math.cos(m)*rx*.62,cy+Math.sin(m)*ry*.62+4)}});
    if(o.hole){c.fillStyle=card;c.beginPath();c.ellipse(cx,cy,rx*.45,ry*.45,0,0,Math.PI*2);c.fill();c.fillStyle=cssv('--ink');c.font='800 20px Tajawal, sans-serif';c.textAlign='center';c.fillText(o.hole,cx,cy+7)}};
  anim(draw);
  tipFor(cv,(x,y)=>{const ex=(x-cx)/rx,ey=(y-cy)/ry;if(ex*ex+ey*ey>1)return null;let ang=Math.atan2(y-cy,(x-cx)*ry/rx);let a=-Math.PI/2;for(const it of items){const e=a+Math.PI*2*it.value/tot;let t=ang;while(t<a)t+=Math.PI*2;if(t<=e)return `${it.label}: ${it.value} (${Math.round(it.value/tot*100)}%)`;a=e}return null});
}

/* ---------- reports ---------- */
function periodRange(type,ds){const d=parseD(ds);
  if(type==='w'){const s=addDays(d,-((d.getDay()+1)%7)),e=addDays(s,6);return{s,e,key:'w:'+iso(s),label:`الأسبوع من ${fmtD(iso(s))} إلى ${fmtD(iso(e))}`}}
  if(type==='m'){const s=new Date(d.getFullYear(),d.getMonth(),1),e=new Date(d.getFullYear(),d.getMonth()+1,0);return{s,e,key:'m:'+iso(s),label:`شهر ${MONTHS[d.getMonth()]} ${d.getFullYear()}`}}
  const n={q:3,h:6,y:12}[type],st=parseD(S.settings.startDate),k=Math.max(0,Math.floor(monthsDiff(st,d)/n)),s=addMonths(st,k*n),e=addDays(addMonths(st,(k+1)*n),-1);
  const label=type==='q'?`الربع ${k%4+1} من السنة ${Math.floor(k/4)+1}`:type==='h'?`النصف ${k%2+1} من السنة ${Math.floor(k/2)+1}`:`السنة ${k+1} من البرنامج`;

   ${staff?`<form class="fgrid" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><label>العلامة (من 100)<input type="number" name="score" min="0" max="100" value="${x.score??''}"></label><label>القرار<select name="status"><option value="graded">قبول وتقييم</option><option value="returned" ${x.status==='returned'?'selected':''}>إعادة للتعديل</option></select></label><label class="full">ملاحظات للطالب<textarea name="feedback" rows="3">${esc(x.feedback||'')}</textarea></label>${gl?`<label class="ck full"><input type="checkbox" name="apply" checked> تحديث إنجاز الهدف «${esc(gl.g.title)}» ليصبح العلامة إن كانت أعلى من الحالي</label>`:''}<div class="factions"><button class="btn pri">حفظ التقييم</button><button type="button" class="btn" data-close>إغلاق</button></div></form>`:(x.feedback?`<h3>ملاحظات المرشد</h3><div class="note">${esc(x.feedback)}</div>`:'')}`);
  const f=$('form',b);if(f)f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),sc=fd.get('score')===''?null:clamp(+fd.get('score')),stt=fd.get('status'),fb=String(fd.get('feedback')||''),ap=fd.get('apply')==='on';
    if(stt==='graded'&&sc==null){toast('أدخل العلامة','err');return}closeModal();
    mutate(S=>{const q=S.subs.find(z=>z.id===id);Object.assign(q,{score:sc,status:stt,feedback:fb});if(ap&&stt==='graded'&&gl){const st=S.students.find(z=>z.id===q.sid);const cur=+(st.progress[gl.g.id]||0);if(sc>cur){st.progress[gl.g.id]=sc;S.history.push({sid:st.id,gid:gl.g.id,date:today(),value:sc})}}log('قُيِّم تسليم '+(s?s.name:'')+(sc!=null?': '+sc+'%':''))});toast('تم الحفظ')}}
function userForm(u){const studs=[['','—'],...S.students.map(s=>[s.id,s.name])];
  formModal({title:u?'تعديل المستخدم':'مستخدم جديد',fields:[{name:'name',label:'الاسم',value:u&&u.name,required:true},{name:'username',label:'اسم المستخدم',value:u&&u.username,required:true,ltr:true},{name:'role',label:'الدور',type:'select',options:Object.entries(ROLES),value:u?u.role:'mentor'},{name:'studentId',label:'الطالب المرتبط (لحساب الطالب)',type:'select',options:studs,value:u&&u.studentId},{name:'password',label:u?'كلمة مرور جديدة (اتركها فارغة للإبقاء)':'كلمة المرور',ltr:true,required:!u,full:true}],
   onSubmit:d=>{if(S.users.some(x=>x.username.toLowerCase()===d.username.toLowerCase()&&(!u||x.id!==u.id))){toast('اسم المستخدم مستخدم مسبقاً','err');return false}if(d.role==='student'&&!d.studentId){toast('اختر الطالب المرتبط بالحساب','err');return false}
     const id=u?u.id:uid(),salt=uid();mutate(S=>{let x=S.users.find(q=>q.id===id);if(!x){x={id};S.users.push(x)}Object.assign(x,{name:d.name,username:d.username,role:d.role,studentId:d.role==='student'?d.studentId:''});if(d.password){x.salt=salt;x.hash=hashPw(salt,d.password);x.mustChange=false}});if(u&&u.id===ME.id)ME=S.users.find(q=>q.id===ME.id)}})}
function myPw(){formModal({title:'تغيير كلمة المرور',fields:[{name:'old',label:'كلمة المرور الحالية',type:'password',required:true,full:true},{name:'n1',label:'كلمة المرور الجديدة',type:'password',required:true},{name:'n2',label:'تأكيدها',type:'password',required:true}],
  onSubmit:d=>{if(hashPw(ME.salt,d.old)!==ME.hash){toast('كلمة المرور الحالية غير صحيحة','err');return false}if(d.n1.length<4){toast('4 أحرف على الأقل','err');return false}if(d.n1!==d.n2){toast('كلمتا المرور غير متطابقتين','err');return false}
   const salt=uid(),h=hashPw(salt,d.n1),id=ME.id;mutate(S=>{const x=S.users.find(q=>q.id===id);x.salt=salt;x.hash=h;x.mustChange=false});ME=S.users.find(q=>q.id===id);toast('تم تغيير كلمة المرور')}})}
function taskInfo(id){const x=taskById(id),ss=S.students.filter(s=>!x.trackId||s.trackId===x.trackId);
  modal(mhead(esc(x.title))+`<div class="muted">${esc(x.type)} · الاستحقاق ${fmtD(x.due)}</div>${x.desc?`<div class="note" style="margin:10px 0">${esc(x.desc)}</div>`:''}<div class="tw"><table><thead><tr><th>الطالب</th><th>الحالة</th><th></th></tr></thead><tbody>${ss.map(s=>{const b=subOf(x.id,s.id);return `<tr><td>${esc(s.name)}</td><td>${subBadge(b)}</td><td>${b?`<button class="btn sm" data-act="review" data-id="${b.id}">مراجعة</button>`:''}</td></tr>`}).join('')}</tbody></table></div><div class="factions" style="margin-top:12px"><button class="btn" data-act="editTask" data-id="${x.id}">${ic('edit')} تعديل</button></div>`,true)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const b64=blob=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
async function backup(){toast('جارٍ تجهيز النسخة…');const out={app:'ifad-platform',date:new Date().toISOString(),state:S,files:{}};
  for(const x of S.subs)for(const f of x.files){try{const b=await Store.getFile(f.id);if(b)out.files[f.id]=await b64(b)}catch(e){}}
  download(new Blob([JSON.stringify(out)],{type:'application/json'}),`نسخة-احتياطية-${today()}.json`)}
async function restore(file){try{const j=JSON.parse(await file.text());if(!j.state||!j.state.users)throw 0;
  confirmBox('ستُستبدل كل البيانات الحالية بمحتوى النسخة الاحتياطية. هل أنت متأكد؟',async()=>{for(const[id,du]of Object.entries(j.files||{})){const b=await(await fetch(du)).blob();await Store.putFile(id,b)}
   S=j.state;await Store.save(S);const me=S.users.find(u=>u.id===ME.id);if(!me){ME=null;try{sessionStorage.removeItem('ifad_uid')}catch(_){}}else ME=me;render();toast('تمت الاستعادة ✓')},'استعادة')}catch(e){toast('الملف ليس نسخة احتياطية صالحة','err')}}

/* ================= events ================= */
function go(r){location.hash=r}
const ACT={
  menu:()=>$('#side').classList.toggle('open'),
  palette:el=>mutate(S=>S.settings.palette=+el.dataset.i),
  theme:el=>mutate(S=>S.settings.theme=el.dataset.v),
  logout:()=>{ME=null;try{sessionStorage.removeItem('ifad_uid')}catch(_){}location.hash='';render()},
  mypw:myPw,addStudent:()=>studentForm(),editStudent:el=>studentForm(stuById(el.dataset.id)),
  delStudent:el=>{const s=stuById(el.dataset.id);confirmBox(`حذف الطالب «${esc(s.name)}» وكل تسليماته وسجلاته؟`,()=>{go('students');mutate(S=>{S.students=S.students.filter(x=>x.id!==s.id);S.subs.filter(x=>x.sid===s.id).forEach(x=>x.files.forEach(f=>Store.delFile(f.id)));S.subs=S.subs.filter(x=>x.sid!==s.id);S.history=S.history.filter(h=>h.sid!==s.id);S.notes=S.notes.filter(n=>n.sid!==s.id);S.users=S.users.filter(u=>u.studentId!==s.id);S.sessions.forEach(q=>q.present=q.present.filter(i=>i!==s.id));log('حُذف الطالب '+s.name)})})},
  addTrack:()=>trackForm(),editTrack:el=>trackForm(S.tracks.find(t=>t.id===el.dataset.id)),
  delTrack:el=>{const t=S.tracks.find(x=>x.id===el.dataset.id);if(S.students.some(s=>s.trackId===t.id)){toast('انقل طلاب المسار أولاً','err');return}confirmBox(`حذف المسار «${esc(t.name)}» بكل محاوره وأهدافه؟`,()=>{go('tracks');mutate(S=>S.tracks=S.tracks.filter(x=>x.id!==t.id))})},
  addAxis:el=>formModal({title:'محور علمي جديد',fields:[{name:'name',label:'اسم المحور',required:true,full:true,ph:'مثلاً: لغة C++ ومنهجية الفهم'}],onSubmit:d=>mutate(S=>S.tracks.find(t=>t.id===el.dataset.id).axes.push({id:uid(),name:d.name,goals:[]}))}),
  editAxis:el=>{const a=S.tracks.find(t=>t.id===el.dataset.t).axes.find(a=>a.id===el.dataset.a);formModal({title:'تعديل المحور',fields:[{name:'name',label:'اسم المحور',value:a.name,required:true,full:true}],onSubmit:d=>mutate(S=>S.tracks.find(t=>t.id===el.dataset.t).axes.find(x=>x.id===a.id).name=d.name)})},
  delAxis:el=>confirmBox('حذف هذا المحور بكل أهدافه؟',()=>mutate(S=>{const t=S.tracks.find(t=>t.id===el.dataset.t);t.axes=t.axes.filter(a=>a.id!==el.dataset.a)})),
  addGoal:el=>goalForm(el.dataset.t,el.dataset.a),
  editGoal:el=>goalForm(el.dataset.t,el.dataset.a,S.tracks.find(t=>t.id===el.dataset.t).axes.find(a=>a.id===el.dataset.a).goals.find(g=>g.id===el.dataset.g)),
  delGoal:el=>confirmBox('حذف هذا الهدف؟',()=>mutate(S=>{const a=S.tracks.find(t=>t.id===el.dataset.t).axes.find(a=>a.id===el.dataset.a);a.goals=a.goals.filter(g=>g.id!==el.dataset.g)})),
  addTask:()=>taskForm(),editTask:el=>taskForm(taskById(el.dataset.id)),taskInfo:el=>taskInfo(el.dataset.id),
  delTask:el=>confirmBox('حذف الوظيفة وكل تسليماتها؟',()=>mutate(S=>{S.subs.filter(x=>x.taskId===el.dataset.id).forEach(x=>x.files.forEach(f=>Store.delFile(f.id)));S.subs=S.subs.filter(x=>x.taskId!==el.dataset.id);S.tasks=S.tasks.filter(t=>t.id!==el.dataset.id)})),
  addSession:()=>sessionForm(),editSession:el=>sessionForm(S.sessions.find(x=>x.id===el.dataset.id)),
  delSession:el=>confirmBox('حذف هذه الجلسة؟',()=>mutate(S=>S.sessions=S.sessions.filter(x=>x.id!==el.dataset.id))),
  submit:el=>submitForm(el.dataset.id),review:el=>reviewBox(el.dataset.id),
  dl:async el=>{const b=await Store.getFile(el.dataset.id);if(b)download(b,el.dataset.name);else toast('الملف غير موجود','err')},
  addUser:()=>userForm(),editUser:el=>userForm(S.users.find(u=>u.id===el.dataset.id)),
  delUser:el=>confirmBox('حذف هذا المستخدم؟',()=>mutate(S=>S.users=S.users.filter(u=>u.id!==el.dataset.id))),
  rtype:el=>{VIEWS._r.type=el.dataset.v;render()},rscopeTo:el=>{VIEWS._r.scope=el.dataset.id;render();scrollTo(0,0)},
  reportFor:el=>{VIEWS._r=Object.assign(VIEWS._r||{type:'m',date:today(),track:''},{scope:el.dataset.id})},
  print:()=>window.print(),backup,
  rmLogo:()=>mutate(S=>S.settings.logo=''),rmHero:()=>mutate(S=>S.settings.hero=''),
  clearDemo:()=>confirmBox('مسح كل الطلاب والوظائف والجلسات التجريبية؟ (المسارات والأهداف والإعدادات تبقى)',()=>mutate(S=>{const ds=new Set(S.students.filter(s=>s.demo).map(s=>s.id)),dt=new Set(S.tasks.filter(t=>t.demo).map(t=>t.id));S.students=S.students.filter(s=>!s.demo);S.users=S.users.filter(u=>!u.demo);S.tasks=S.tasks.filter(t=>!t.demo);S.subs=S.subs.filter(x=>!x.demo&&!ds.has(x.sid)&&!dt.has(x.taskId));S.sessions=S.sessions.filter(x=>!x.demo);S.history=S.history.filter(h=>!ds.has(h.sid));S.notes=S.notes.filter(n=>!ds.has(n.sid));S.activity=[];log('مُسحت البيانات التجريبية، المنصة جاهزة للعمل')}),'مسح'),
  loadDemo:()=>mutate(S=>seedDemo(S)),
  resetAll:()=>confirmBox('سيُحذف كل شيء وتعود المنصة لحالتها الأولى (admin / admin). هل أنت متأكد تماماً؟',async()=>{S=blankState();await Store.save(S);ME=null;try{sessionStorage.removeItem('ifad_uid')}catch(_){}render()},'إعادة الضبط')
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'||e.target.closest('[data-close]')){closeModal();return}
  const sr=$('#sres');if(sr&&!e.target.closest('.hsearch'))sr.classList.remove('open');
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('button,a,input,select,textarea')){go(g.dataset.go);return}
  const el=e.target.closest('[data-act]');if(!el||el.matches('input,textarea,select'))return;
  const fn=ACT[el.dataset.act];if(!fn)return;if(el.tagName==='A'&&el.dataset.act!=='reportFor')e.preventDefault();if(el.tagName==='TR'&&e.target.closest('button')&&e.target.closest('button')!==el&&e.target.closest('[data-act]')!==el)return;fn(el)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.act==='goalv'){const v=+el.value,sid=el.dataset.sid,gid=el.dataset.gid;mutate(S=>{const s=S.students.find(x=>x.id===sid);s.progress[gid]=v;const d=today();const h=S.history.find(q=>q.sid===sid&&q.gid===gid&&q.date===d);if(h)h.value=v;else S.history.push({sid,gid,date:d,value:v})});return}
  if(el.dataset.act==='note'){const{sid,key}=el.dataset,text=el.value;mutate(S=>{let n=S.notes.find(q=>q.sid===sid&&q.key===key);if(!n){n={sid,key};S.notes.push(n)}n.text=text});toast('حُفظت الملاحظة');return}
  if(el.id==='st'){VIEWS._sf={...(VIEWS._sf||{q:''}),t:el.value};render()}
  if(el.id==='subf'){VIEWS._subf=el.value;render()}
  if(el.id==='rdate'){VIEWS._r.date=el.value||today();render()}
  if(el.id==='rscope'){VIEWS._r.scope=el.value;render()}
  if(el.id==='rtrack'){VIEWS._r.track=el.value;render()}
  if(el.id==='restore'&&el.files[0])restore(el.files[0]);
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.act==='goalv')el.nextElementSibling.textContent=el.value+'%';
  if(el.id==='sq'){VIEWS._sf={...(VIEWS._sf||{t:''}),q:el.value};const pos=el.selectionStart;render();const n=$('#sq');n.focus();n.setSelectionRange(pos,pos)}
  if(el.id==='gsearch')gsearch(el.value)});
document.addEventListener('submit',async e=>{const f=e.target;
  if(f.id==='setId'){e.preventDefault();const fd=new FormData(f),lf=fd.get('logo'),hf=fd.get('hero');const logo=lf&&lf.size?await readImage(lf,320):null,hero=hf&&hf.size?await readImage(hf,1800,.82):null;
    mutate(S=>{S.settings.name=fd.get('name');S.settings.subtitle=fd.get('subtitle');if(logo)S.settings.logo=logo;if(hero)S.settings.hero=hero});toast('تم الحفظ')}
  if(f.id==='setProg'){e.preventDefault();const fd=new FormData(f);mutate(S=>{S.settings.startDate=fd.get('startDate');S.settings.years=clamp(+fd.get('years'),1,10);S.settings.finalGoal=fd.get('finalGoal')});toast('تم الحفظ')}});
function gsearch(q){const box=$('#sres');q=q.trim();if(!q){box.classList.remove('open');return}const R=[];
  S.students.forEach(s=>s.name.includes(q)&&R.push([`#student:${s.id}`,'user',s.name,'طالب']));
  S.tracks.forEach(t=>{t.name.includes(q)&&R.push([`#track:${t.id}`,'track',t.name,'مسار']);t.axes.forEach(a=>{a.name.includes(q)&&R.push([`#track:${t.id}`,'target',a.name,'محور']);a.goals.forEach(g=>g.title.toLowerCase().includes(q.toLowerCase())&&R.push([`#track:${t.id}`,'target',g.title,'هدف · '+t.name]))})});
  S.tasks.forEach(t=>t.title.includes(q)&&R.push(['#tasks','task',t.title,'وظيفة']));
  box.innerHTML=R.slice(0,12).map(([h,i,l,k])=>`<a href="${h}">${ic(i)}${esc(l)}<small>${k}</small></a>`).join('')||'<a>لا نتائج</a>';box.classList.add('open')}
window.addEventListener('hashchange',()=>{ROUTE=(location.hash.slice(1)||'home');const sd=$('#side');if(sd)sd.classList.remove('open');render();scrollTo(0,0)});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(ME&&!$('#modal').classList.contains('open')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},250)});

/* ================= boot ================= */
(async()=>{
  try{S=await Store.init()}catch(e){S=null}
  if(!S||!S.users){S=blankState();seedDemo(S);await Store.save(S)}
  try{const id=sessionStorage.getItem('ifad_uid');ME=S.users.find(u=>u.id===id)||null}catch(_){}
  ROUTE=location.hash.slice(1)||'home';render();
  if(Store.mode==='server')setInterval(async()=>{if($('#modal').classList.contains('open')||document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const ns=await Store.poll();if(ns){S=ns;if(ME)ME=S.users.find(u=>u.id===ME.id)||null;render()}},15000);
})();
</script>
